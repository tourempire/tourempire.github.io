name: Promo videó

# A live webes játékot "leforgatja" (Playwright, telefon 9:16), BELEVÁGVA az animált
# mini-játékokat (fény-show + dobolós), majd ffmpeg: punch-in zoom + beúszó feliratok.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'A jatek URL-je (?dbg)'
        default: 'https://tourempire.github.io/?dbg'

jobs:
  vid:
    runs-on: ubuntu-latest
    steps:
      - name: Deps
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-dejavu-core >/dev/null 2>&1 || sudo apt-get install -y ffmpeg
      - name: Forgatas + render
        env:
          GAME_URL: ${{ inputs.url }}
        run: |
          python3 - <<'PY'
          import os, time, glob, subprocess
          from playwright.sync_api import sync_playwright
          URL=os.environ['GAME_URL']

          START = r"""() => { try { var G=window.__G;
            try{ if(G.setLang) G.setLang('en'); }catch(e){}
            var b=[].slice.call(document.querySelectorAll('button'));
            var qs=b.find(function(x){return /quick start|gyors ind|default|alapbe/i.test(x.textContent);});
            if(!qs) qs=b.find(function(x){return /^\s*(start|kezd)/i.test(x.textContent);});
            if(qs){qs.click();return 'clicked';} return 'no-btn';
          } catch(e){ return 'ERR '+e.message; } }"""
          STATE = r"""() => { try { var G=window.__G,S=G.S;
            try{ if(G.setLang) G.setLang('en'); }catch(e){}
            S.money=2650000;S.rep=380;S.week=32;S.credits=925;S.toursDone=7;S.earned=8200000;S.agency='Star Agency';
            S.obDone=true;S.ob=null;S.started=true;S.detail=null;
            var all=Object.keys(G.AM);S.roster=all.slice(0,3);
            S.roster.forEach(function(id,i){var st=G.artState(id);
              try{Object.keys(st.fans).forEach(function(r){st.fans[r]=Math.round(52+Math.random()*44);});}catch(e){}
              st.streams=Math.round(2200000+i*1800000);st.morale=84;st.energy=90;st.hype=0.28;st.rels=3+i;st.lastCritic=82;});
            if(G.save)G.save();
            var m=document.getElementById('modal');if(m){m.className='';m.innerHTML='';}
            var ob=document.getElementById('ob');if(ob){ob.className='';ob.innerHTML='';}
            var obb=document.getElementById('obbar');if(obb){obb.className='';obb.innerHTML='';}
            S.tab='iroda';G.render();return 'ok';
          } catch(e){ return 'ERR '+e.message; } }"""
          TR="()=>{try{var G=window.__G;if(G.translateUI){G.translateUI(document.body);G.translateUI(document.getElementById('app'));}}catch(e){}}"
          # eloallit egy ELO koncert-stubot, hogy a mini-jatekok elinduljanak
          LIVE="function(){var G=window.__G,S=G.S;var ak=S.roster[0];var ck=Object.keys(G.CM)[0];"\
               "S.live={artist:ak,setlist:[0,1,2],stops:[{city:ck}],mini:{},pausedLeft:999999,ends:Date.now()+9e8,__test:true};}"

          with sync_playwright() as p:
              b=p.chromium.launch(args=['--no-sandbox'])
              ctx=b.new_context(viewport={'width':480,'height':854}, device_scale_factor=2,
                                record_video_dir='vid', record_video_size={'width':480,'height':854})
              pg=ctx.new_page()
              t_start=time.time()
              pg.goto(URL, wait_until='networkidle', timeout=60000)
              pg.wait_for_function("() => window.__G && window.__G.S && window.__G.render", timeout=30000)
              print("start:", pg.evaluate(START)); pg.wait_for_timeout(500)
              print("state:", pg.evaluate(STATE)); pg.wait_for_timeout(700)
              pg.evaluate(TR)
              t_beats=time.time()
              def beat(js, hold, scroll=0):
                  if js:
                      try: print("  beat:", pg.evaluate(js))
                      except Exception as e: print('beat err',e)
                  pg.evaluate(TR); pg.wait_for_timeout(200)
                  if scroll:
                      steps=12
                      for k in range(steps):
                          pg.evaluate("(y)=>{var v=document.getElementById('view')||document.scrollingElement;if(v)v.scrollTop+=y;}", scroll/steps)
                          pg.wait_for_timeout(int(hold/steps))
                  else:
                      pg.wait_for_timeout(hold)
              beat("()=>{window.__G.S.tab='iroda';window.__G.S.detail=null;window.__G.render();}", 1800)                 # hook / office
              beat("()=>{window.__G.S.tab='eloadok';window.__G.S.detail=null;window.__G.render();}", 1500)              # roster
              beat("()=>{var G=window.__G;try{G.S.detail=null;G.startTour(G.S.roster[0]);}catch(e){}G.S.tab='terkep';G.render();}", 2000)  # world map
              beat("()=>{var G=window.__G;G.S.tour=null;try{G.closeMini&&G.closeMini(false);}catch(e){}("+LIVE+")();try{G.openLights(0);return 'lights';}catch(e){return 'ERR '+e.message;}}", 5000)   # FENY-SHOW
              beat("()=>{var G=window.__G;try{G.closeMini&&G.closeMini(false);}catch(e){}("+LIVE+")();try{G.openMini(0);return 'drum';}catch(e){return 'ERR '+e.message;}}", 5000)                        # DOBOLOS
              beat("()=>{var G=window.__G,S=G.S;try{G.closeMini&&G.closeMini(false);}catch(e){}S.live=null;S.tour=null;S.detail=null;S.tab='studio';S.studio=S.roster[0];G.render();return 'studio';}", 1500)  # studio
              beat("()=>{window.__G.S.tab='iroda';window.__G.render();}", 2300)                                        # final / outro
              offset=max(0.0, (t_beats - t_start) - 0.3)
              print("offset:", round(offset,2))
              ctx.close(); b.close()
          raw=sorted(glob.glob('vid/*.webm'))[0]
          print("raw video:", raw)

          font="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          caps=[(0.1,1.8,"FROM GARAGE TO GLOBAL EMPIRE",50),
                (2.0,3.3,"SIGN THE BIGGEST STARS",58),
                (3.5,5.3,"PLAN WORLD TOURS",64),
                (5.7,10.2,"RUN THE LIGHT SHOW",62),
                (10.7,15.2,"HIT EVERY BEAT",64),
                (15.5,16.8,"DROP #1 HITS",62),
                (16.9,19.0,"TOUR EMPIRE  -  FREE ON THE APP STORE",42)]
          vf=["scale=1080:1920:flags=lanczos","setsar=1","fps=30",
              "zoompan=z='min(pzoom+0.0006,1.12)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=30"]
          for a,z,txt,fs in caps:
              al="if(lt(t,%s),0,if(lt(t,%s),(t-%s)/0.25,1))"%(a, a+0.25, a)
              vf.append(("drawtext=fontfile=%s:text=%s:fontcolor=white:fontsize=%d:box=1:boxcolor=black@0.5:"
                         "boxborderw=24:x=(w-text_w)/2:y=h-440:alpha='%s':enable='between(t,%s,%s)'")%(font,txt,fs,al,a,z))
          vfs=",".join(vf)
          cmd=["ffmpeg","-y","-ss",str(round(offset,2)),"-i",raw,"-t","19","-vf",vfs,
               "-c:v","libx264","-pix_fmt","yuv420p","-profile:v","high","-crf","20",
               "-movflags","+faststart","-an","promo.mp4"]
          print("rendering...")
          r=subprocess.run(cmd, capture_output=True, text=True)
          print(r.stderr[-1200:])
          print("OUT exists:", os.path.exists('promo.mp4'), os.path.getsize('promo.mp4') if os.path.exists('promo.mp4') else 0)
          PY
      - name: Feltoltes
        uses: actions/upload-artifact@v4
        with:
          name: promo-video
          path: |
            promo.mp4
            vid/*.webm
          if-no-files-found: warn
