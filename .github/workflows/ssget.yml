name: SS URL
on: {workflow_dispatch: {}}
jobs:
  u:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - run: pip install pyjwt cryptography requests
      - run: |
          python3 - <<'PY'
          import os,time,jwt,requests
          kid=os.environ['ASC_KEY_ID'];iss=os.environ['ASC_ISSUER_ID'];p8=os.environ['ASC_KEY_P8']
          if 'BEGIN PRIVATE KEY' not in p8:
              import base64;p8=base64.b64decode(p8).decode()
          def H():
              tok=jwt.encode({'iss':iss,'iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'},p8,algorithm='ES256',headers={'kid':kid,'typ':'JWT'})
              return {'Authorization':'Bearer '+tok}
          B='https://api.appstoreconnect.apple.com'
          sid='ff1cac4e-e4fc-403d-a15b-980109214ee7'
          d=requests.get(B+f'/v1/appScreenshotSets/{sid}/appScreenshots',headers=H()).json().get('data',[])
          for s in d:
            fn=s['attributes'].get('fileName')
            if fn=='04_studio.png':
              r=requests.delete(B+f"/v1/appScreenshots/{s['id']}",headers=H())
              print('DELETE',fn,r.status_code)
          # maradek
          d2=requests.get(B+f'/v1/appScreenshotSets/{sid}/appScreenshots',headers=H()).json().get('data',[])
          print('Maradt:',[x['attributes'].get('fileName') for x in d2])
          PY
