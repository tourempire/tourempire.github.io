name: iOS csomag

# macOS futtatón épül (Xcode kell hozzá, Windowsról nem megy) — a GitHub biztosítja.
#
# Titkok nélkül: csak ELLENŐRZI, hogy a projekt lefordul (szimulátor build, aláírás nélkül).
# Titkokkal: az Xcode az App Store Connect API-kulccsal MAGA hozza létre és tölti le a
# tanúsítványt és a provisioning profilt (felhő-aláírás), majd IPA készül, és kérésre
# felkerül a TestFlightbe. Így nem kell .p12-t és profilt kézzel exportálni.
#
# Szükséges titkok (GitHub → Settings → Secrets and variables → Actions):
#   IOS_TEAM_ID        – 10 karakteres Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID         – App Store Connect API-kulcs azonosítója
#   ASC_ISSUER_ID      – Issuer ID (ugyanazon az oldalon)
#   ASC_KEY_P8         – a letöltött .p8 fájl TARTALMA (a -----BEGIN sorral együtt)
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Feltöltés TestFlightbe a build után'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek
        run: npm install

      - name: Webes fájlok összeállítása (www/)
        run: npm run build

      - name: iOS projekt létrehozása
        run: npx cap add ios

      - name: Natív beállítások (AdMob azonosítók)
        run: node scripts/native-config.mjs

      - name: Ikonok és indítókép generálása
        run: >
          npx capacitor-assets generate --ios --assetPath store-assets
          --iconBackgroundColor '#06070a' --iconBackgroundColorDark '#06070a'
          --splashBackgroundColor '#06070a' --splashBackgroundColorDark '#06070a'

      - name: Szinkron
        run: npx cap sync ios

      - name: DIAG — zene-fájlok a bundle-ben
        run: |
          echo "=== www/assets ==="; ls -la www/assets/ || echo "NINCS www/assets"
          echo "=== ios/App/App/public/assets ==="; ls -la ios/App/App/public/assets/ || echo "NINCS public/assets"
          echo "=== mp3-ok a natív public-ban ==="
          find ios/App/App/public -iname "*.mp3" -printf "%10s  %p\n" || echo "NINCS mp3 a public-ban"

      - name: Verzió és build-szám
        run: |
          PLIST=ios/App/App/Info.plist
          VER=$(node -p "require('./package.json').version")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          # FORGATÁS TILTVA — az app CSAK álló (portré) módban működik (iPhone ÉS iPad).
          # A Capacitor által generált Info.plist orientation-tömbjeit lecseréljük CSAK Portrait-ra.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # iPad multitasking KIKAPCSOLVA (UIRequiresFullScreen=true) — enélkül az App Store megköveteli
          # mind a 4 orientációt iPaden. Így a portré-only iPaden is engedélyezett (nincs Split View).
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          # App Tracking (ATT): NEM kérünk tracking-engedélyt (nem-személyre-szabott hirdetés).
          # Töröljük az esetleges NSUserTrackingUsageDescription kulcsot, hogy ne legyen olyan
          # rendszer-engedélykérő szöveg, amely az app nyelvétől eltérhetne (Guideline 4).
          /usr/libexec/PlistBuddy -c "Delete :NSUserTrackingUsageDescription" "$PLIST" 2>/dev/null || true
          echo "verzió $VER · build ${{ github.run_number }} · orientation: Portrait-only · UIRequiresFullScreen: true · ATT: nincs"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST"
          # (Audio: a normál WebKit-viselkedést hagyjuk — a hang a néma kapcsolót követi, mint a legtöbb
          #  játék. A .playback hack kivéve, mert a Web Audio úgyis a WebKit saját munkamenetét használja.)

      - name: Fordítási próba (ha nincs Apple-titok)
        if: env.ASC_KEY_P8 == ''
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -25

      - name: API-kulcs kiírása
        if: env.ASC_KEY_P8 != ''
        run: |
          mkdir -p ~/private_keys
          # A titok lehet nyers .p8 tartalom vagy base64 — mindkettőt kezeljük.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          fi
          echo "kulcs kiírva"

      - name: Archiválás (aláírás nélkül)
        if: env.ASC_KEY_P8 != ''
        working-directory: ios/App
        run: |
          # Az archívum ALÁÍRÁS NÉLKÜL készül; az App Store terjesztési aláírás az
          # EXPORT lépésben történik. Így nem próbál fejlesztői profilt csinálni
          # (ahhoz regisztrált eszköz kellene) — a terjesztési profilhoz nem kell.
          # TARGETED_DEVICE_FAMILY=1 → CSAK iPhone (a játék álló, telefonra tervezett).
          # Így az App Store nem kér iPad-screenshotokat, és nincs iPad-only követelmény.
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            TARGETED_DEVICE_FAMILY=1 \
            archive

      - name: IPA exportálása
        if: env.ASC_KEY_P8 != ''
        working-directory: ios/App
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$PWD/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$PWD/output" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la output

      - name: DIAG — mp3-ok az IPA-ban (BIZONYÍTÉK)
        if: env.ASC_KEY_P8 != ''
        working-directory: ios/App
        run: |
          echo "=== mp3 / assets az IPA-ban ==="
          unzip -l output/App.ipa | grep -iE "\.mp3|/assets/" || echo "!!! NINCS mp3/assets az IPA-ban !!!"

      - name: Feltöltés TestFlightbe
        if: ${{ inputs.upload_testflight && env.ASC_KEY_P8 != '' }}
        working-directory: ios/App
        run: |
          xcrun altool --upload-app -f output/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: IPA letölthetően
        if: env.ASC_KEY_P8 != ''
        uses: actions/upload-artifact@v4
        with:
          name: tour-empire-ios
          path: ios/App/output/*.ipa
          if-no-files-found: warn
