name: ASC állapot (read-only)

# CSAK LEKÉRDEZ — az App Store Connect API-n megnézi az app állapotát:
# van-e App Store verzió, milyen state-ben, kész-e az adatlap, és a legutóbbi build
# feldolgozási állapotát. Semmit NEM módosít, nem küld be semmit.

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Python deps
        run: pip install pyjwt cryptography requests

      - name: Lekérdezés
        run: |
          python3 - <<'PY'
          import os, time, json, jwt, requests

          kid=os.environ['ASC_KEY_ID']; iss=os.environ['ASC_ISSUER_ID']; p8=os.environ['ASC_KEY_P8']
          if 'BEGIN PRIVATE KEY' not in p8:
              import base64; p8=base64.b64decode(p8).decode()
          tok=jwt.encode({'iss':iss,'iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'},
                         p8, algorithm='ES256', headers={'kid':kid,'typ':'JWT'})
          H={'Authorization':'Bearer '+tok}
          B='https://api.appstoreconnect.apple.com'
          def g(u,**p):
              r=requests.get(B+u,headers=H,params=p);
              if r.status_code>=300: print('HTTP',r.status_code,u,r.text[:400])
              return r.json()

          apps=g('/v1/apps').get('data',[])
          print("=== APPOK ===")
          for a in apps:
              at=a['attributes']
              print(f"- {at.get('name')} | bundle={at.get('bundleId')} | sku={at.get('sku')} | id={a['id']}")
          # a tourempire appot keressük
          app=next((a for a in apps if 'tourempire' in (a['attributes'].get('bundleId') or '')), apps[0] if apps else None)
          if not app:
              print("!!! Nincs app az accounton"); raise SystemExit(0)
          aid=app['id']; print("\n=== KIVÁLASZTOTT APP ===", app['attributes'].get('name'), aid)

          print("\n=== APP STORE VERZIÓK ===")
          vs=g(f'/v1/apps/{aid}/appStoreVersions', **{'limit':10}).get('data',[])
          if not vs: print("(nincs egyetlen App Store verzió sem — sosem volt kiadva/előkészítve)")
          for v in vs:
              va=v['attributes']
              print(f"- {va.get('versionString')} | state={va.get('appStoreState')} | platform={va.get('platform')} | release={va.get('releaseType')} | id={v['id']}")

          # --- RÉSZLETES SCREENSHOT-SET DUMP a szerkeszthető verzióhoz ---
          editable0={'PREPARE_FOR_SUBMISSION','METADATA_REJECTED','DEVELOPER_REJECTED','REJECTED','INVALID_BINARY'}
          ev0=next((v for v in vs if v['attributes'].get('appStoreState') in editable0), None)
          if ev0:
              vid0=ev0['id']
              print("\n=== SCREENSHOT-SETEK (display type / darab) ===")
              for l in g(f'/v1/appStoreVersions/{vid0}/appStoreVersionLocalizations').get('data',[]):
                  la=l['attributes']
                  sets=g(f"/v1/appStoreVersionLocalizations/{l['id']}/appScreenshotSets").get('data',[])
                  print(f"  [{la.get('locale')}] setek: {len(sets)}")
                  for s in sets:
                      dt=s['attributes'].get('screenshotDisplayType')
                      sc=g(f"/v1/appScreenshotSets/{s['id']}/appScreenshots").get('data',[])
                      print(f"    - {dt}: {len(sc)} kép  (setId={s['id']})")
              # age rating / jog / privacy
              app_full=g(f'/v1/apps/{aid}', **{'include':'appInfos'})
              print("\n=== BUILD DEVICE-FAMILY (a verzióhoz kötött) ===")
              b0=g(f'/v1/appStoreVersions/{vid0}/build').get('data')
              if b0:
                  bf=g(f"/v1/builds/{b0['id']}")
                  print("  build attrs:", {k:bf['data']['attributes'].get(k) for k in ('version','processingState','usesNonExemptEncryption','iconAssetToken')})

          # legfrissebb szerkeszthető verzió adatlap-teljesség
          editable={'PREPARE_FOR_SUBMISSION','METADATA_REJECTED','DEVELOPER_REJECTED','REJECTED','INVALID_BINARY','WAITING_FOR_REVIEW','DEVELOPER_REMOVED_FROM_SALE'}
          ev=next((v for v in vs if v['attributes'].get('appStoreState') in editable), vs[0] if vs else None)
          if ev:
              vid=ev['id']
              print(f"\n=== ADATLAP ELLENŐRZÉS (verzió {ev['attributes'].get('versionString')} / {ev['attributes'].get('appStoreState')}) ===")
              loc=g(f'/v1/appStoreVersions/{vid}/appStoreVersionLocalizations').get('data',[])
              print("Nyelvi lokalizációk:", len(loc))
              for l in loc[:3]:
                  la=l['attributes']
                  print(f"  - {la.get('locale')}: leírás={'IGEN' if la.get('description') else 'NINCS'} kulcsszó={'IGEN' if la.get('keywords') else 'NINCS'}")
                  # screenshots
                  sets=g(f"/v1/appStoreVersionLocalizations/{l['id']}/appScreenshotSets").get('data',[])
                  tot=0
                  for s in sets:
                      sc=g(f"/v1/appScreenshotSets/{s['id']}/appScreenshots").get('data',[])
                      tot+=len(sc)
                  print(f"    screenshotok ({la.get('locale')}): {tot}")
              # build hozzárendelve?
              b=g(f'/v1/appStoreVersions/{vid}/build').get('data')
              print("Hozzárendelt build:", (b or {}).get('id') if b else "NINCS")

          print("\n=== REVIEW SUBMISSIONS ===")
          for r0 in g('/v1/reviewSubmissions', **{'filter[app]':aid,'filter[platform]':'IOS','limit':20}).get('data',[]):
              ra=r0['attributes']
              print(f"- {r0['id'][:8]} | state={ra.get('state')} | submitted={ra.get('submittedDate')}")

          print("\n=== IN-APP PURCHASE TERMÉKEK ===")
          iaps=g(f'/v1/apps/{aid}/inAppPurchasesV2', **{'limit':50}).get('data',[])
          if not iaps: print("(nincs egyetlen IAP-termék sem az appon)")
          for p in iaps:
              pa=p['attributes']; pid=p['id']
              print(f"- {pa.get('productId')} | name={pa.get('name')} | type={pa.get('inAppPurchaseType')} | state={pa.get('state')}")
              # lokalizációk (név/leírás)
              locs=g(f'/v2/inAppPurchases/{pid}/inAppPurchaseLocalizations').get('data',[])
              for l in locs:
                  a2=l['attributes']
                  print(f"    loc {a2.get('locale')}: name={a2.get('name')!r} desc={'IGEN' if a2.get('description') else 'NINCS'} state={a2.get('state')}")
              # ár (van-e price schedule)
              try:
                  sch=g(f'/v2/inAppPurchases/{pid}/iapPriceSchedule')
                  print("    price schedule:", 'VAN' if sch.get('data') else 'NINCS')
              except Exception as e:
                  print("    price schedule: ?", e)
              # review-screenshot
              ss=g(f'/v2/inAppPurchases/{pid}/appStoreReviewScreenshot').get('data')
              print("    review-screenshot:", 'VAN' if ss else 'NINCS')

          print("\n=== BUILDEK (TestFlight, feldolgozás) ===")
          builds=g('/v1/builds', **{'filter[app]':aid,'limit':6,'sort':'-version'}).get('data',[])
          for bd in builds:
              ba=bd['attributes']
              print(f"- build {ba.get('version')} | processing={ba.get('processingState')} | expired={ba.get('expired')} | uploaded={ba.get('uploadedDate')}")
          PY
